<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin Barang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.98);
    }
    
    .card-header {
      background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
      border: none;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .card-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 250px;
      height: 250px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }
    
    .logo-circle {
      width: 85px;
      height: 85px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    
    .card-header h2 {
      color: white;
      font-weight: 800;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    
    .card-header p {
      color: rgba(255, 255, 255, 0.95);
      font-size: 0.9rem;
      margin-top: 8px;
    }
    
    .card-header .badge {
      background: rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 0.8rem;
      padding: 6px 14px;
      margin: 12px 0 0 0;
      backdrop-filter: blur(10px);
    }
    
    .card-body {
      padding: 35px;
    }
    
    .form-label {
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    
    .form-control {
      border: 1px solid #E5E7EB !important;
      border-radius: 10px !important;
      padding: 10px 14px !important;
      font-size: 0.95rem !important;
      transition: all 0.3s ease !important;
      background: white !important;
    }
    
    .form-control:focus {
      border-color: #FFD700 !important;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1) !important;
      outline: none !important;
    }
    
    .mb-3 {
      margin-bottom: 16px !important;
    }
    
    .btn-login {
      background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
      border: none;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 10px;
      transition: all 0.3s ease;
      color: #333;
      font-size: 1rem;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
      color: #333;
    }
    
    .alert {
      border: none;
      border-radius: 10px;
      border-left: 4px solid #EF4444;
      padding: 12px 16px;
    }
    
    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #DC2626;
    }
    
    .error-message {
      display: none;
    }
    
    .error-message.show {
      display: block;
      animation: slideInUp 0.3s ease;
    }
    
    .switch-role {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #E5E7EB;
    }
    
    .switch-role p {
      margin: 0 0 10px 0;
      color: #6B7280;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .switch-role a {
      color: #FFD700;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }
    
    .switch-role a:hover {
      gap: 10px;
    }
    
    @media (max-width: 576px) {
      .card-body {
        padding: 25px;
      }
      
      .card-header {
        padding: 30px 20px;
      }
      
      .card-header h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <div class="logo-circle">
          <img src="/images/musaba-logo.svg" alt="Kasir Logo" style="width: 65px; height: 65px; object-fit: contain;">
        </div>
        <h2>KASIR</h2>
        <span class="badge"><i class="bi bi-box me-1"></i>Admin Barang</span>
        <p>Sistem Manajemen Penjualan Modern</p>
      </div>
      <div class="card-body">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label for="username" class="form-label"><i class="bi bi-person me-2"></i>Username</label>
            <input type="text" class="form-control" id="username" required placeholder="Masukkan username" autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label"><i class="bi bi-key me-2"></i>Password</label>
            <input type="password" class="form-control" id="password" required placeholder="Masukkan password">
          </div>
          <div id="errorMessage" class="alert alert-danger error-message" role="alert"></div>
          <button type="submit" class="btn btn-login btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login Admin Barang
          </button>
        </form>

        <div class="switch-role">
          <p>Ingin login sebagai Admin Kasir?</p>
          <a href="/login-kasir"><i class="bi bi-arrow-right"></i>Masuk sebagai Admin Kasir</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
  <script src="/js/login-barang.js"></script>
  
  <!-- Check if already logged in -->
  <script>
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/';  // Redirect to dashboard/main page
      }
    });
  </script>
</body>
</html>
