<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric pattern background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B6FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer geometric shape -->
  <path d="M50,10 L80,25 L80,75 L50,90 L20,75 L20,25 Z" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Shopping cart icon -->
  <g transform="translate(50,50)">
    <!-- Cart body -->
    <path d="M-15,-5 L-10,8 L10,8 L15,-5 Z" fill="#5B6FFF" stroke="white" stroke-width="1.5"/>
    <!-- Cart handle -->
    <path d="M-12,-5 Q-20,-15 -5,-20" stroke="#5B6FFF" stroke-width="2.5" fill="none"/>
    <path d="M12,-5 Q20,-15 5,-20" stroke="#FF69B4" stroke-width="2.5" fill="none"/>
    <!-- Wheels -->
    <circle cx="-8" cy="10" r="2" fill="white"/>
    <circle cx="8" cy="10" r="2" fill="white"/>
    <!-- Checkmark -->
    <path d="M-5,0 L0,4 L6,-3" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="15" cy="15" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="85" cy="85" r="2" fill="#FFD700" opacity="0.8"/>
</svg>
