<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer yellow/orange flower pattern -->
  <!-- Top square -->
  <rect x="70" y="10" width="60" height="60" rx="8" fill="none" stroke="#FFC107" stroke-width="12"/>
  
  <!-- Right square -->
  <rect x="120" y="70" width="60" height="60" rx="8" fill="none" stroke="#FFC107" stroke-width="12"/>
  
  <!-- Bottom square -->
  <rect x="70" y="120" width="60" height="60" rx="8" fill="none" stroke="#FFC107" stroke-width="12"/>
  
  <!-- Left square -->
  <rect x="20" y="70" width="60" height="60" rx="8" fill="none" stroke="#FFC107" stroke-width="12"/>
  
  <!-- Connecting circles (flower petals) -->
  <circle cx="130" cy="60" r="30" fill="none" stroke="#FFC107" stroke-width="12"/>
  <circle cx="140" cy="130" r="30" fill="none" stroke="#FFC107" stroke-width="12"/>
  <circle cx="60" cy="140" r="30" fill="none" stroke="#FFC107" stroke-width="12"/>
  <circle cx="50" cy="70" r="30" fill="none" stroke="#FFC107" stroke-width="12"/>
  
  <!-- Center shield/house shape - Teal/Green -->
  <g transform="translate(100, 100)">
    <!-- Outer shield -->
    <path d="M -25,-25 L 25,-25 L 25,5 Q 0,30 0,30 Q 0,30 -25,5 Z" fill="#1B8A8A" stroke="#1B8A8A" stroke-width="1"/>
    
    <!-- Left arch -->
    <path d="M -8,-5 Q -12,5 -8,15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right arch -->
    <path d="M 8,-5 Q 12,5 8,15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Vertical lines (bars) -->
    <line x1="-5" y1="0" x2="-5" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="5" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>