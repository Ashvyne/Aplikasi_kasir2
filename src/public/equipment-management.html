<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Alat - Aplikasi Peminjaman</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-gradient-to-b from-blue-700 to-blue-600 dark:from-blue-900 dark:to-blue-800 text-white shadow-lg flex flex-col">
      <div class="p-6 border-b border-blue-600 dark:border-blue-700">
        <div class="flex items-center gap-3">
          <i class="bi bi-tools text-2xl"></i>
          <span class="text-xl font-bold">Manajemen Alat</span>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto p-4 space-y-2">
        <button onclick="showSection('list')" class="nav-link active w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 hover:bg-blue-600 dark:hover:bg-blue-700 transition-colors">
          <i class="bi bi-list text-lg w-6"></i>
          <span class="font-medium">Daftar Alat</span>
        </button>
        <button onclick="openEquipmentFormModal('create')" class="nav-link w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 hover:bg-blue-600 dark:hover:bg-blue-700 transition-colors">
          <i class="bi bi-plus-circle text-lg w-6"></i>
          <span class="font-medium">Tambah Alat Baru</span>
        </button>
      </nav>
      <div class="p-4 border-t border-blue-600 dark:border-blue-700">
        <button onclick="logout()" class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 dark:bg-blue-800 rounded-lg font-medium flex items-center justify-center gap-2">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="px-8 py-6 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button onclick="window.location.href='/dashboard-admin.html'" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" title="Kembali ke Dashboard">
              <i class="bi bi-arrow-left text-2xl text-blue-600 dark:text-blue-400"></i>
            </button>
            <h1 class="text-3xl font-bold" id="pageTitle">Daftar Alat</h1>
          </div>
          <div class="flex items-center gap-6">
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
              <i class="bi bi-moon-stars text-xl dark:hidden"></i>
              <i class="bi bi-sun-fill text-xl hidden dark:inline"></i>
            </button>
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold" id="userAvatar">AD</div>
              <span id="userName" class="font-medium">Admin</span>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto">
        <!-- Section: List Alat -->
        <section id="listSection" class="section p-8 space-y-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">Daftar Alat Peminjaman</h2>
            <button onclick="openEquipmentFormModal('create')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center gap-2">
              <i class="bi bi-plus-lg"></i> Tambah Alat
            </button>
          </div>

          <!-- Equipment List -->
          <div id="equipmentLoadingState" class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-8 text-center">
            <i class="bi bi-hourglass text-4xl text-blue-600 mb-3 block"></i>
            <p class="text-gray-600 dark:text-gray-400">Memuat data alat...</p>
          </div>

          <div id="equipmentTableState" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Equipment cards akan diisi di sini -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal Reusable: Tambah/Edit Alat -->
  <div id="equipmentFormModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-4xl w-full my-8">
      <div id="modalHeader" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 flex items-center justify-between sticky top-0">
        <div class="flex items-center gap-3">
          <i id="modalIcon" class="bi bi-plus-circle text-2xl"></i>
          <h2 id="modalTitle" class="text-xl font-bold">Tambah Alat Baru</h2>
        </div>
        <button onclick="closeEquipmentFormModal()" class="text-white hover:text-gray-200 text-2xl">×</button>
      </div>

      <div class="p-8 space-y-6 max-h-[80vh] overflow-y-auto">
        <form id="equipmentForm" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Nama Alat -->
            <div>
              <label class="block text-sm font-semibold mb-2">Nama Alat <span class="text-red-600">*</span></label>
              <input type="text" id="eqName" required placeholder="Contoh: Mouse Fantech"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Kode Alat -->
            <div>
              <label class="block text-sm font-semibold mb-2">Kode Alat <span class="text-red-600">*</span></label>
              <input type="text" id="eqCode" required placeholder="Contoh: EQ001"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Kode harus unik, tidak boleh sama dengan alat lain</p>
            </div>

            <!-- Kategori -->
            <div>
              <label class="block text-sm font-semibold mb-2">Kategori</label>
              <input type="text" id="eqCategory" placeholder="Contoh: Peralatan Las"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Tarif Sewa Harian -->
            <div>
              <label class="block text-sm font-semibold mb-2">Tarif Sewa Harian (Rp) <span class="text-red-600">*</span></label>
              <input type="number" id="eqDailyRate" required placeholder="0" min="1"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Harga sewa per hari (minimum Rp 1)</p>
            </div>

            <!-- Harga Perolehan -->
            <div>
              <label class="block text-sm font-semibold mb-2">Harga Perolehan (Rp)</label>
              <input type="number" id="eqAcquisitionCost" placeholder="0"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Total Qty -->
            <div>
              <label class="block text-sm font-semibold mb-2">Total Kuantitas</label>
              <input type="number" id="eqTotalQty" placeholder="1" value="1"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <!-- Lokasi -->
            <div>
              <label class="block text-sm font-semibold mb-2">Lokasi Penyimpanan</label>
              <input type="text" id="eqLocation" placeholder="Contoh: Gudang A"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>

          <!-- Deskripsi -->
          <div>
            <label class="block text-sm font-semibold mb-2">Deskripsi</label>
            <textarea id="eqDescription" placeholder="Spesifikasi atau catatan alat..."
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4"></textarea>
          </div>

          <!-- Upload Gambar -->
          <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
            <label class="block text-sm font-semibold mb-4">Gambar Alat (Opsional)</label>
            
            <!-- Image Preview -->
            <div id="imagePreviewContainer" class="hidden mb-4">
              <img id="imagePreview" src="" alt="Preview" class="max-h-64 object-cover rounded-lg border border-gray-300 dark:border-gray-600">
              <button type="button" onclick="clearImagePreview()" class="mt-2 px-3 py-1 text-sm bg-red-600 hover:bg-red-700 text-white rounded">
                Hapus Gambar
              </button>
            </div>

            <!-- Upload Area -->
            <div id="uploadArea" class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition">
              <input type="file" id="equipmentImage" accept="image/*" class="hidden" onchange="previewEquipmentImage()" />
              <div onclick="document.getElementById('equipmentImage').click()">
                <i class="bi bi-image text-4xl text-gray-400 mb-3 block"></i>
                <p class="text-gray-600 dark:text-gray-400 mb-2">Klik untuk upload atau drag & drop</p>
                <p class="text-sm text-gray-500">JPG, PNG, WEBP, GIF (Max 5MB)</p>
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex gap-3 pt-6 border-t border-gray-200 dark:border-gray-700">
            <button type="button" onclick="closeEquipmentFormModal()" class="flex-1 px-4 py-3 bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-700 text-gray-900 dark:text-white rounded-lg font-medium transition">
              Batal
            </button>
            <button type="submit" id="submitBtn" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition flex items-center justify-center gap-2">
              <i class="bi bi-plus-lg"></i> Buat Alat
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let allEquipment = [];

    function checkAuth() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (!token || user.role !== 'admin') {
        window.location.href = '/login';
        return;
      }
      document.getElementById('userName').textContent = user.name || 'Admin';
      if (user.name) document.getElementById('userAvatar').textContent = user.name.substring(0, 2).toUpperCase();
      loadDarkModePreference();
      loadEquipmentData();
    }

    function showSection(section) {
      document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active', 'bg-blue-600', 'dark:bg-blue-700'));
      const sectionId = section + 'Section';
      const sectionEl = document.getElementById(sectionId);
      if (sectionEl) sectionEl.classList.remove('hidden');
      const btn = event?.target?.closest('.nav-link');
      if (btn) btn.classList.add('active', 'bg-blue-600', 'dark:bg-blue-700');
      const titles = { list: 'Daftar Alat', create: 'Tambah Alat Baru' };
      document.getElementById('pageTitle').textContent = titles[section] || 'Manajemen Alat';
    }

    // ============ REUSABLE EQUIPMENT FORM MODAL ============
    // State untuk tracking mode dan equipment ID
    let formModalState = {
      mode: 'create', // 'create' atau 'edit'
      equipmentId: null,
      currentImage: null
    };

    // Modal Functions
    function openEquipmentFormModal(mode = 'create', equipmentId = null) {
      formModalState.mode = mode;
      formModalState.equipmentId = equipmentId;
      formModalState.currentImage = null;

      const modal = document.getElementById('equipmentFormModal');
      const form = document.getElementById('equipmentForm');
      const submitBtn = document.getElementById('submitBtn');
      const modalHeader = document.getElementById('modalHeader');
      const modalTitle = document.getElementById('modalTitle');
      const modalIcon = document.getElementById('modalIcon');

      // Reset form
      form.reset();
      document.getElementById('equipmentImage').value = '';
      clearImagePreview();

      if (mode === 'create') {
        // MODE: CREATE
        modalTitle.textContent = 'Tambah Alat Baru';
        modalIcon.className = 'bi bi-plus-circle text-2xl';
        modalHeader.className = 'bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 flex items-center justify-between sticky top-0';
        submitBtn.innerHTML = '<i class="bi bi-plus-lg"></i> Buat Alat';
        submitBtn.className = 'flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition flex items-center justify-center gap-2';
      } else if (mode === 'edit' && equipmentId) {
        // MODE: EDIT
        const equipment = allEquipment.find(eq => eq.id === equipmentId);
        if (!equipment) {
          Swal.fire('Error', 'Alat tidak ditemukan', 'error');
          return;
        }

        // Populate form dengan data
        document.getElementById('eqName').value = equipment.name;
        document.getElementById('eqCode').value = equipment.code;
        document.getElementById('eqCategory').value = equipment.category || '';
        document.getElementById('eqDailyRate').value = equipment.daily_rental_rate;
        document.getElementById('eqAcquisitionCost').value = equipment.acquisition_cost || 0;
        document.getElementById('eqTotalQty').value = equipment.total_quantity;
        document.getElementById('eqLocation').value = equipment.location || '';
        document.getElementById('eqDescription').value = equipment.description || '';

        // Show image if exists
        if (equipment.image_url) {
          document.getElementById('imagePreview').src = equipment.image_url;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
          formModalState.currentImage = equipment.image_url;
        }

        // Update header styling
        modalTitle.textContent = 'Kelola Alat';
        modalIcon.className = 'bi bi-pencil-square text-2xl';
        modalHeader.className = 'bg-gradient-to-r from-green-600 to-green-700 text-white p-6 flex items-center justify-between sticky top-0';
        submitBtn.innerHTML = '<i class="bi bi-check-lg"></i> Simpan Perubahan';
        submitBtn.className = 'flex-1 px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition flex items-center justify-center gap-2';
      }

      modal.classList.remove('hidden');
    }

    function closeEquipmentFormModal() {
      document.getElementById('equipmentFormModal').classList.add('hidden');
      document.getElementById('equipmentForm').reset();
      document.getElementById('equipmentImage').value = '';
      clearImagePreview();
      formModalState = { mode: 'create', equipmentId: null, currentImage: null };
    }

    function previewEquipmentImage() {
      const file = document.getElementById('equipmentImage').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImagePreview() {
      document.getElementById('equipmentImage').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('imagePreview').src = '';
    }

    // Unified form submission handler
    document.getElementById('equipmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Validasi
      const name = document.getElementById('eqName').value.trim();
      const code = document.getElementById('eqCode').value.trim();
      const dailyRate = document.getElementById('eqDailyRate').value;
      const totalQty = document.getElementById('eqTotalQty').value;

      if (!name || !code || !dailyRate) {
        Swal.fire('Validasi Error', 'Nama alat, kode, dan tarif harian harus diisi', 'warning');
        return;
      }

      if (parseInt(dailyRate) <= 0) {
        Swal.fire('Validasi Error', 'Tarif harian harus lebih dari 0', 'warning');
        return;
      }

      const equipmentData = {
        name: name,
        code: code,
        category: document.getElementById('eqCategory').value.trim() || 'Umum',
        daily_rental_rate: parseInt(dailyRate),
        acquisition_cost: parseInt(document.getElementById('eqAcquisitionCost').value) || 0,
        total_quantity: parseInt(totalQty),
        location: document.getElementById('eqLocation').value.trim(),
        description: document.getElementById('eqDescription').value.trim()
      };

      const token = localStorage.getItem('token');
      const submitBtn = document.getElementById('submitBtn');
      const originalBtnText = submitBtn.innerHTML;
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="bi bi-hourglass"></i> ' + (formModalState.mode === 'create' ? 'Menyimpan...' : 'Memperbarui...');

      try {
        const isCreate = formModalState.mode === 'create';
        const endpoint = isCreate ? `${API_BASE}/equipment` : `${API_BASE}/equipment/${formModalState.equipmentId}`;
        const method = isCreate ? 'POST' : 'PUT';

        const response = await fetch(endpoint, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(equipmentData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || 'Gagal memproses alat');
        }

        const resultId = isCreate ? data.equipment?.id : formModalState.equipmentId;

        // Upload image if selected
        const imageFile = document.getElementById('equipmentImage').files[0];
        if (imageFile && resultId) {
          const formData = new FormData();
          formData.append('image', imageFile);

          try {
            await fetch(`${API_BASE}/equipment/${resultId}/upload-image`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}` },
              body: formData
            });
          } catch (imgError) {
            console.warn('Gambar gagal diupload, tapi data sudah disimpan:', imgError);
          }
        }

        Swal.fire({
          title: 'Berhasil!',
          text: `Alat "${equipmentData.name}" berhasil ${isCreate ? 'ditambahkan' : 'diperbarui'}`,
          icon: 'success',
          confirmButtonColor: isCreate ? '#3085d6' : '#10b981',
          confirmButtonText: 'OK'
        }).then(() => {
          closeEquipmentFormModal();
          loadEquipmentData();
        });
      } catch (error) {
        console.error('Error:', error);
        Swal.fire({
          title: 'Error',
          text: error.message,
          icon: 'error',
          confirmButtonColor: '#d33'
        });
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    });

    async function loadEquipmentData() {
      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/equipment`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Gagal memuat data');

        const data = await response.json();
        allEquipment = data.equipment || [];

        renderEquipmentCards();
        document.getElementById('equipmentLoadingState').classList.add('hidden');
        document.getElementById('equipmentTableState').classList.remove('hidden');
      } catch (error) {
        console.error('Error loading equipment:', error);
        document.getElementById('equipmentLoadingState').textContent = 'Gagal memuat data: ' + error.message;
      }
    }

    function renderEquipmentCards() {
      const container = document.getElementById('equipmentTableState');
      
      if (allEquipment.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-500">Tidak ada alat daftar</p></div>';
        return;
      }

      container.innerHTML = allEquipment.map(eq => `
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
          <!-- Image -->
          <div class="relative h-48 bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 flex items-center justify-center group">
            ${eq.image_url ? `
              <img src="${eq.image_url}" alt="${eq.name}" class="w-full h-full object-cover">
              <button onclick="openEquipmentFormModal('edit', ${eq.id})" class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <span class="text-white text-sm font-semibold flex items-center gap-2"><i class="bi bi-pencil"></i> Ubah</span>
              </button>
            ` : `
              <button onclick="openEquipmentFormModal('edit', ${eq.id})" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-center">
                <i class="bi bi-image text-5xl mb-2 block"></i>
                <p class="text-sm">Upload Gambar</p>
              </button>
            `}
          </div>

          <!-- Info -->
          <div class="p-4 space-y-3">
            <div>
              <h3 class="font-bold text-lg">${eq.name}</h3>
              <p class="text-sm text-gray-600 dark:text-gray-400">${eq.code}</p>
            </div>

            <div class="grid grid-cols-2 gap-3 text-sm">
              <div>
                <p class="text-gray-600 dark:text-gray-400">Kategori</p>
                <p class="font-semibold">${eq.category}</p>
              </div>
              <div>
                <p class="text-gray-600 dark:text-gray-400">Tarif/hari</p>
                <p class="font-semibold">Rp${parseInt(eq.daily_rental_rate).toLocaleString()}</p>
              </div>
              <div>
                <p class="text-gray-600 dark:text-gray-400">Total Unit</p>
                <p class="font-semibold">${eq.total_quantity}</p>
              </div>
              <div>
                <p class="text-gray-600 dark:text-gray-400">Tersedia</p>
                <p class="font-semibold">${eq.available_quantity}</p>
              </div>
            </div>

            <div class="border-t border-gray-200 dark:border-gray-700 pt-3 flex gap-2">
              <button onclick="editEquipment(${eq.id})" class="flex-1 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg font-medium transition">
                Edit
              </button>
              <button onclick="deleteEquipment(${eq.id})" class="flex-1 px-3 py-2 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg font-medium transition">
                Hapus
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function editEquipment(id) {
      openEquipmentFormModal('edit', id);
    }

    async function deleteEquipment(id) {
      const confirm = await Swal.fire({
        title: 'Hapus Alat?',
        text: 'Data ini akan dihapus secara permanen',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: 'Hapus'
      });

      if (!confirm.isConfirmed) return;

      const token = localStorage.getItem('token');

      try {
        const response = await fetch(`${API_BASE}/equipment/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Gagal hapus alat');

        Swal.fire('Berhasil', 'Alat berhasil dihapus', 'success');
        loadEquipmentData();
      } catch (error) {
        Swal.fire('Error', error.message, 'error');
      }
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
    }

    function loadDarkModePreference() {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }
    }

    function logout() {
      Swal.fire({
        title: 'Konfirmasi Logout',
        text: 'Apakah Anda yakin ingin logout?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Ya, Logout!',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = '/login';
        }
      });
    }

    checkAuth();
  </script>
</body>
</html>
