<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Electronic Goods Equipment Loan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #e8eef7 0%, #f3f6fb 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    
    .login-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }
    
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      background: white;
    }
    
    .card-header {
      background: white;
      border: none;
      padding: 50px 40px 40px 40px;
      text-align: center;
      position: relative;
    }
    
    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 40px;
      color: white;
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
    }
    
    .card-header h2 {
      color: #1f2937;
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    
    .card-header p {
      color: #6b7280;
      font-size: 0.95rem;
      margin: 8px 0 0 0;
    }
    
    .card-body {
      padding: 40px;
    }
    
    .form-label {
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    
    .form-control {
      border: 1.5px solid #e5e7eb !important;
      border-radius: 10px !important;
      padding: 11px 16px !important;
      font-size: 0.95rem !important;
      transition: all 0.3s ease !important;
      background: white !important;
      color: #1f2937 !important;
    }
    
    .form-control:focus {
      border-color: #1e40af !important;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1) !important;
      outline: none !important;
    }
    
    .form-control::placeholder {
      color: #9ca3af;
    }
    
    .mb-3 {
      margin-bottom: 18px !important;
    }
    
    .btn-login {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border: none;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 10px;
      transition: all 0.3s ease;
      color: white;
      font-size: 0.95rem;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.35);
      color: white;
    }
    
    .btn-login:active {
      transform: translateY(0);
    }
    
    .alert {
      border: none;
      border-radius: 10px;
      border-left: 4px solid #dc2626;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: none;
    }
    
    .alert-danger {
      background: rgba(220, 38, 38, 0.08);
      color: #991b1b;
    }
    
    .alert.show {
      display: block;
      animation: slideInUp 0.3s ease;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    .spinner.show {
      display: inline-block;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 576px) {
      .card-body {
        padding: 25px;
      }
      
      .card-header {
        padding: 35px 20px 25px 20px;
      }
      
      .card-header h2 {
        font-size: 1.5rem;
      }
      
      .demo-accounts {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <div class="logo-icon">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h2>Electronic Goods Equipment Loan</h2>
      </div>
      <div class="card-body">
        <div id="errorMessage" class="alert alert-danger" role="alert"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input 
              type="text" 
              class="form-control" 
              id="username" 
              required 
              placeholder="Masukkan username" 
              autofocus
            >
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              required 
              placeholder="Masukkan password"
            >
          </div>
          
          <button type="submit" class="btn btn-login w-100">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Login</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMessage = document.getElementById('errorMessage');
      const btn = event.target.querySelector('button[type="submit"]');
      const spinner = document.getElementById('spinner');
      
      if (!username || !password) {
        errorMessage.textContent = 'Username dan password harus diisi';
        errorMessage.classList.add('show');
        return;
      }
      
      try {
        errorMessage.classList.remove('show');
        btn.disabled = true;
        spinner.classList.add('show');
        
        console.log('📡 Sending login request...');
        
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            username: username,
            email: username,
            password: password
          })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          console.log('✓ Login successful');
          
          // Redirect based on role
          const role = data.user?.role;
          if (role === 'admin') {
            window.location.href = '/dashboard-admin';
          } else if (role === 'manager') {
            window.location.href = '/dashboard-manager';
          } else if (role === 'cashier') {
            window.location.href = '/dashboard-cashier';
          } else if (role === 'supervisor') {
            window.location.href = '/dashboard-supervisor';
          } else if (role === 'staff') {
            window.location.href = '/dashboard-staff';
          } else if (role === 'borrower') {
            window.location.href = '/dashboard-borrower';
          } else {
            window.location.href = '/dashboard-admin';
          }
        } else {
          errorMessage.textContent = data.message || 'Login gagal. Periksa username dan password.';
          errorMessage.classList.add('show');
          btn.disabled = false;
          spinner.classList.remove('show');
        }
      } catch (error) {
        console.error('❌ Network error:', error);
        errorMessage.textContent = 'Terjadi kesalahan koneksi. Pastikan server running.';
        errorMessage.classList.add('show');
        btn.disabled = false;
        spinner.classList.remove('show');
      }
    }

    // Cek apakah user sudah login saat halaman dimuat
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (token) {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const role = user.role;
        if (role === 'admin') {
          window.location.href = '/dashboard-admin';
        } else if (role === 'manager') {
          window.location.href = '/dashboard-manager';
        } else if (role === 'cashier') {
          window.location.href = '/dashboard-cashier';
        } else if (role === 'supervisor') {
          window.location.href = '/dashboard-supervisor';
        } else if (role === 'staff') {
          window.location.href = '/dashboard-staff';
        } else if (role === 'borrower') {
          window.location.href = '/dashboard-borrower';
        }
      }
    });
  </script>
</body>
</html>
