<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Sistem Kasir Modern</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .signup-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signup-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .signup-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .signup-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .header-content {
      position: relative;
      z-index: 2;
    }

    .logo-box {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 35px;
    }

    .signup-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .signup-header p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .signup-body {
      padding: 35px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .signup-btn {
      width: 100%;
      padding: 13px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .signup-btn:active {
      transform: translateY(0);
    }

    .signup-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .form-footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .form-footer p {
      font-size: 14px;
      color: #666;
    }

    .form-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .form-footer a:hover {
      color: #764ba2;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .alert.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .alert.show {
      display: block;
    }

    .loading {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    .signup-btn:disabled .loading {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .password-strength {
      margin-top: 6px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    @media (max-width: 480px) {
      .signup-header {
        padding: 30px 20px;
      }

      .signup-body {
        padding: 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .signup-header h1 {
        font-size: 24px;
      }

      .logo-box {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-card">
      <div class="signup-header">
        <div class="header-content">
          <div class="logo-box">📝</div>
          <h1>Daftar Akun</h1>
          <p>Buat akun baru untuk mengakses sistem</p>
        </div>
      </div>
      
      <div class="signup-body">
        <div id="alertBox" class="alert"></div>
        
        <form id="signupForm" onsubmit="handleSignup(event)">
          <!-- Name -->
          <div class="form-group">
            <label for="name">Nama Lengkap *</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              placeholder="Masukkan nama lengkap"
              required
            >
          </div>

          <!-- Username and Email Row -->
          <div class="form-row">
            <div class="form-group">
              <label for="username">Username *</label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Pilih username"
                required
              >
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Alamat email"
                required
              >
            </div>
          </div>

          <!-- Password and Confirm Password Row -->
          <div class="form-row">
            <div class="form-group">
              <label for="password">Password *</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Minimal 8 karakter"
                required
              >
              <div class="password-strength">
                <div class="password-strength-bar" id="strengthBar"></div>
              </div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Konfirmasi Password *</label>
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                placeholder="Ulangi password"
                required
              >
            </div>
          </div>

          <!-- Role Selection -->
          <div class="form-group">
            <label for="role">Role Akun</label>
            <select id="role" name="role">
              <option value="cashier">Kasir</option>
              <option value="borrower">Peminjam</option>
              <option value="admin">Administrator</option>
            </select>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="signup-btn" id="submitBtn">
            <span id="btnText">Buat Akun</span>
            <div class="loading"></div>
          </button>

          <!-- Form Footer -->
          <div class="form-footer">
            <p>Sudah punya akun? <a href="/login.html">Login di sini</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Get base URL from current location
    const API_BASE_URL = `${window.location.origin}/api`;

    /**
     * Show alert message
     */
    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert ${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {
          alertBox.classList.remove('show');
        }, 3000);
      }
    }

    /**
     * Check password strength
     */
    function checkPasswordStrength() {
      const password = document.getElementById('password').value;
      const strengthBar = document.getElementById('strengthBar');
      let strength = 0;

      if (password.length >= 8) strength += 25;
      if (password.length >= 12) strength += 25;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
      if (/[0-9]/.test(password)) strength += 12.5;
      if (/[!@#$%^&*]/.test(password)) strength += 12.5;

      strengthBar.style.width = strength + '%';
      
      if (strength < 30) {
        strengthBar.style.backgroundColor = '#ff6b6b';
      } else if (strength < 60) {
        strengthBar.style.backgroundColor = '#ffd93d';
      } else if (strength < 85) {
        strengthBar.style.backgroundColor = '#6bcf7f';
      } else {
        strengthBar.style.backgroundColor = '#4fc3f7';
      }
    }

    /**
     * Validate form
     */
    function validateForm() {
      const name = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Check if all fields are filled
      if (!name || !username || !email || !password || !confirmPassword) {
        showAlert('Semua field harus diisi', 'error');
        return false;
      }

      // Check username length
      if (username.length < 3) {
        showAlert('Username minimal 3 karakter', 'error');
        return false;
      }

      // Check password length
      if (password.length < 8) {
        showAlert('Password minimal 8 karakter', 'error');
        return false;
      }

      // Check password match
      if (password !== confirmPassword) {
        showAlert('Password dan konfirmasi password tidak cocok', 'error');
        return false;
      }

      // Check email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('Format email tidak valid', 'error');
        return false;
      }

      return true;
    }

    /**
     * Handle signup form submission
     */
    async function handleSignup(event) {
      event.preventDefault();

      if (!validateForm()) {
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      // Disable button and show loading
      submitBtn.disabled = true;
      btnText.style.display = 'none';

      try {
        const formData = {
          name: document.getElementById('name').value.trim(),
          username: document.getElementById('username').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: document.getElementById('role').value
        };

        const response = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
          showAlert('Akun berhasil dibuat! Silakan login.', 'success');
          
          // Reset form
          document.getElementById('signupForm').reset();
          document.getElementById('strengthBar').style.width = '0%';

          // Redirect to login after 2 seconds
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          showAlert(data.message || 'Terjadi kesalahan saat mendaftar', 'error');
        }
      } catch (error) {
        console.error('Signup error:', error);
        showAlert('Terjadi kesalahan koneksi. Silakan coba lagi.', 'error');
      } finally {
        // Re-enable button
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
      }
    }

    // Add password strength check listener
    document.getElementById('password').addEventListener('input', checkPasswordStrength);

    // Optional: Add Enter key support
    document.getElementById('confirmPassword').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        handleSignup(event);
      }
    });
  </script>
</body>
</html>
