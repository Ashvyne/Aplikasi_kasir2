<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Role Login - Aplikasi Kasir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 500px;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 16px 16px 0 0;
      padding: 40px 20px;
      text-align: center;
    }
    .card-header h2 {
      color: white;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .card-header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
    }
    .role-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }
    .role-btn {
      text-decoration: none;
      padding: 30px 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: white;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .role-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      color: white;
      text-decoration: none;
    }
    .role-btn i {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    .role-btn-barang {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .role-btn-barang:hover {
      filter: brightness(1.1);
    }
    .role-btn-kasir {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .role-btn-kasir:hover {
      filter: brightness(1.1);
    }
    .role-desc {
      font-size: 0.9rem;
      margin-top: 10px;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <h2><i class="bi bi-cart3"></i> KASIR</h2>
        <p>Pilih Tipe Admin untuk Login</p>
      </div>
      <div class="card-body p-4">
        <p class="text-center text-muted mb-4">
          Silakan pilih role Anda untuk melanjutkan ke halaman login:
        </p>
        
        <div class="role-buttons">
          <a href="/login-barang" class="role-btn role-btn-barang">
            <i class="bi bi-box"></i>
            <span>Admin Barang</span>
            <div class="role-desc">
              Dashboard, Produk,<br>Barang Masuk, Stok, Laporan
            </div>
          </a>
          
          <a href="/login-kasir" class="role-btn role-btn-kasir">
            <i class="bi bi-cash-coin"></i>
            <span>Admin Kasir</span>
            <div class="role-desc">
              Kasir &<br>Riwayat Transaksi
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Jika user sudah login, redirect ke halaman sesuai role
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      
      if (token) {
        console.log('✓ User sudah login, redirect ke halaman sesuai role');
        
        if (user.role === 'admin_kasir') {
          window.location.href = '/pos';
        } else {
          window.location.href = '/dashboard';
        }
      }
    });
  </script>
</body>
</html>
