version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kasir-prod-backend:${IMAGE_TAG:-latest}
    container_name: kasir-prod-backend
    restart: unless-stopped
    env_file:
      - /opt/Aplikasi_kasir2/.env
    volumes:
      - /data/kasir/uploads:/app/src/public/uploads
    networks:
      - kasir_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kasir-prod-frontend:${IMAGE_TAG:-latest}
    container_name: kasir-prod-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kasir_prod_network

networks:
  kasir_prod_network:
    name: kasir_prod_network
    driver: bridge
